{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card p-4">
      <h2 class="card-title text-center mb-4">Register</h2>
      <form method="post">
        <div class="mb-3">
          <label for="username" class="form-label">Username (internal)</label>
          <input type="text" class="form-control" name="username" id="username" required>
        </div>
        <div class="mb-3">
          <label for="youtube" class="form-label">YouTube Username</label>
          <input type="text" class="form-control" name="youtube" id="youtube" required>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" name="password" id="password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Register</button>
      </form>
      <p class="text-center mt-3">Already have an account? <a href="{{ url_for('login') }}">Log in here</a>.</p>
    </div>
  </div>
</div>
{% endblock %}
