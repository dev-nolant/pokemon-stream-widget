{% extends "base.html" %}
{% block title %}Edit Profile{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card p-4">
      <h2 class="card-title text-center mb-4">Edit Profile</h2>
      <form method="post">
        <div class="mb-3">
          <label for="youtube" class="form-label">YouTube Username</label>
          <input type="text" class="form-control" name="youtube" id="youtube" value="{{ current_user.youtube }}" required>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">New Password (leave blank to keep current)</label>
          <input type="password" class="form-control" name="password" id="password">
        </div>
        <button type="submit" class="btn btn-primary w-100">Save Changes</button>
      </form>
      <p class="text-center mt-3"><a href="{{ url_for('dashboard') }}">Back to Dashboard</a></p>
    </div>
  </div>
</div>
{% endblock %}
